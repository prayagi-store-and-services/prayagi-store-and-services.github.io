name: Kendra preview tests
on:
  pull_request:
    paths:
      - 'kendra*'
      - 'tests/kendra-link.test.js'
      - '.github/workflows/kendra-test.yml'
  push:
    branches: [main]
    paths:
      - 'kendra*'
      - 'tests/kendra-link.test.js'
permissions:
  contents: read
jobs:
  kendra-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node tests/kendra-link.test.js

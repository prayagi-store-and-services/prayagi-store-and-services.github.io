name: Deployed staff login abuse tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/deployed-staff-abuse.test.js

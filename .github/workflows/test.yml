name: Availability tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/availability.test.js
      - run: node tests/csp-booking.test.js
      - run: node -e "const fs=require('fs');new Function(fs.readFileSync('apps-script/Code.gs','utf8')+fs.readFileSync('apps-script/Availability.gs','utf8'))"
      - run: node --check calendar.js
